<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>কন্ট্রোল প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0E1420;--card:#172033;--line:#26324b;--tx:#E8EEF8;--mu:#8A98B3;--ac:#3D7BFF;--am:#FFB547}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;padding:16px}
.w{max-width:860px;margin:auto}h2{margin:6px 0 14px}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 16px}
button.on,.pr{background:var(--ac);border-color:var(--ac)}.dg{color:#ff7b7b}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:10px;border-radius:10px;font:inherit;margin:4px 0 12px}
label{color:var(--mu);font-size:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.r{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.r img{width:44px;height:44px;border-radius:11px;object-fit:cover}.r div{flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.g{grid-template-columns:1fr}}.hid{display:none}#m{color:var(--am);min-height:22px}</style></head><body><div class="w">
<div id="lg" class="c" style="max-width:380px;margin:60px auto"><h2>অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="em" type="email"><label>পাসওয়ার্ড</label><input id="pw" type="password"><button class="pr" onclick="login()" style="width:100%">লগইন</button><p id="le" class="dg"></p></div>
<div id="ap" class="hid"><h2>কন্ট্রোল প্যানেল <button class="dg" style="float:right" onclick="auth.signOut()">লগআউট</button></h2><div id="m"></div>
<div class="tabs"><button class="on" data-t="t1">অ্যাপ</button><button data-t="t2">বিজ্ঞাপন</button><button data-t="t3">পপ-আপ নোটিফিকেশন</button><button data-t="t4">রিভিউ</button><button data-t="t5">মেসেজ</button></div>
<div id="t1"><div class="c"><h3 id="ft">নতুন অ্যাপ যোগ করুন</h3><input type="hidden" id="id"><div class="g">
<div><label>অ্যাপের নাম</label><input id="name"></div><div><label>ক্যাটাগরি</label><input id="category" placeholder="গেম, টুলস..."></div>
<div><label>আইকন ছবির লিংক</label><input id="icon"></div><div><label>ডাউনলোড লিংক</label><input id="link"></div>
<div><label>ভার্সন</label><input id="version"></div><div><label>সাইজ</label><input id="size" placeholder="25 MB"></div></div>
<label>বিবরণ</label><textarea id="desc" rows="3"></textarea><button class="pr" onclick="saveApp()">সেভ করুন</button> <button onclick="clr()">নতুন ফর্ম</button></div>
<div class="c" id="list"></div></div>
<div id="t2" class="hid"><div class="c"><label>বিজ্ঞাপন চালু?</label><select id="en"><option value="true">চালু</option><option value="false">বন্ধ</option></select>
<label>প্রতি ধাপে অপেক্ষার সময় (সেকেন্ড)</label><input id="timer" type="number" value="10">
<label>বিজ্ঞাপন ১ (HTML / AdSense / ব্যানার কোড)</label><textarea id="ad1" rows="5"></textarea>
<label>বিজ্ঞাপন ২ (HTML / AdSense / ব্যানার কোড)</label><textarea id="ad2" rows="5"></textarea><button class="pr" onclick="saveAds()">বিজ্ঞাপন সেভ</button></div></div>
<div id="t3" class="hid"><div class="c"><label>পপ-আপ চালু?</label><select id="pe"><option value="true">চালু</option><option value="false">বন্ধ</option></select>
<label>শিরোনাম</label><input id="pt"><label>বার্তা</label><textarea id="pm" rows="3"></textarea><label>বাটন লিংক (ঐচ্ছিক)</label><input id="pl">
<button class="pr" onclick="savePop()">সেভ ও সবাইকে পাঠান</button></div></div><div id="t4" class="hid"></div><div id="t5" class="hid"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== একই Firebase কনফিগ এখানেও বসান ======
var CFG={apiKey:"AIzaSyAWy2_xPZyEYzBZJb4NxIkb-IkuU8R4atM",authDomain:"appstore-55234.firebaseapp.com",projectId:"appstore-55234"};
firebase.initializeApp(CFG);var auth=firebase.auth(),db=firebase.firestore(),$=function(i){return document.getElementById(i)},F=['name','category','icon','link','version','size','desc'],apps=[];
function msg(t){$('m').textContent=t;setTimeout(function(){$('m').textContent=''},2500)}
function login(){auth.signInWithEmailAndPassword($('em').value,$('pw').value).catch(function(e){$('le').textContent='লগইন ব্যর্থ: '+e.message})}
auth.onAuthStateChanged(function(u){$('lg').classList.toggle('hid',!!u);$('ap').classList.toggle('hid',!u);if(u)init()});
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');['t1','t2','t3','t4','t5'].forEach(function(t){$(t).classList.toggle('hid',t!=b.dataset.t)})}});
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function rm(c,id){if(confirm('ডিলিট করবেন?'))db.collection(c).doc(id).delete()}
function init(){db.collection('reviews').orderBy('createdAt','desc').onSnapshot(function(s){$('t4').innerHTML='<div class="c">'+(s.docs.map(function(d){var r=d.data(),a=apps.filter(function(x){return x.id==r.appId})[0];return '<div class="r"><div><b>'+esc(r.name)+'</b> <span style="color:var(--am)">'+'★'.repeat(r.stars)+'</span> <small style="color:var(--mu)">'+esc(a?a.name:'')+'</small><br>'+esc(r.text)+'</div><button class="dg" onclick="rm(\'reviews\',\''+d.id+'\')">ডিলিট</button></div>'}).join('')||'<p style="color:var(--mu)">কোনো রিভিউ নেই।</p>')+'</div>'});
db.collection('messages').orderBy('createdAt','desc').onSnapshot(function(s){$('t5').innerHTML='<div class="c">'+(s.docs.map(function(d){var m=d.data();return '<div class="r"><div><b>'+esc(m.name)+'</b> <small style="color:var(--mu)">'+esc(m.contact)+'</small><br>'+esc(m.text)+'</div><button class="dg" onclick="rm(\'messages\',\''+d.id+'\')">ডিলিট</button></div>'}).join('')||'<p style="color:var(--mu)">কোনো মেসেজ নেই।</p>')+'</div>'});
db.collection('apps').orderBy('createdAt','desc').onSnapshot(function(s){apps=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});
$('list').innerHTML=apps.map(function(a,i){return '<div class="r"><img src="'+(a.icon||'')+'"><div><b>'+a.name.replace(/</g,'&lt;')+'</b><br><small style="color:var(--mu)">ডাউনলোড: '+(a.downloads||0)+'</small></div><button onclick="ed('+i+')">এডিট</button><button class="dg" onclick="del('+i+')">ডিলিট</button></div>'}).join('')||'<p style="color:var(--mu)">এখনো কোনো অ্যাপ নেই।</p>'});
db.doc('config/ads').get().then(function(d){var a=d.data()||{};$('en').value=String(a.enabled!==false);$('timer').value=a.timer||10;$('ad1').value=a.ad1||'';$('ad2').value=a.ad2||''});
db.doc('config/popup').get().then(function(d){var p=d.data()||{};$('pe').value=String(!!p.enabled);$('pt').value=p.title||'';$('pm').value=p.message||'';$('pl').value=p.link||''})}
function saveApp(){var o={};F.forEach(function(f){o[f]=$(f).value.trim()});if(!o.name||!o.link)return msg('নাম ও ডাউনলোড লিংক দিন');
var id=$('id').value;(id?db.collection('apps').doc(id).update(o):db.collection('apps').add(Object.assign(o,{downloads:0,createdAt:Date.now()}))).then(function(){msg('সেভ হয়েছে');clr()}).catch(function(e){msg(e.message)})}
function ed(i){var a=apps[i];$('id').value=a.id;F.forEach(function(f){$(f).value=a[f]||''});$('ft').textContent='অ্যাপ এডিট করুন';scrollTo(0,0)}
function clr(){$('id').value='';F.forEach(function(f){$(f).value=''});$('ft').textContent='নতুন অ্যাপ যোগ করুন'}
function del(i){if(confirm('ডিলিট করবেন?'))db.collection('apps').doc(apps[i].id).delete()}
function saveAds(){db.doc('config/ads').set({enabled:$('en').value=='true',timer:+$('timer').value||10,ad1:$('ad1').value,ad2:$('ad2').value}).then(function(){msg('বিজ্ঞাপন সেভ হয়েছে')})}
function savePop(){db.doc('config/popup').set({enabled:$('pe').value=='true',title:$('pt').value,message:$('pm').value,link:$('pl').value,id:String(Date.now())}).then(function(){msg('পপ-আপ পাঠানো হয়েছে')})}
</script></body></html>
