<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppHub - ফ্রি অ্যাপ স্টোর</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1420;--card:#172033;--line:#26324b;--tx:#E8EEF8;--mu:#8A98B3;--ac:#3D7BFF;--am:#FFB547}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif}
.hid{display:none}header{position:sticky;top:0;z-index:5;background:#0E1420ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:auto;padding:0 16px}.bar{display:flex;gap:14px;align-items:center;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;letter-spacing:-.5px}.logo i{color:var(--am);font-style:normal}
#q{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:11px 16px;border-radius:12px;font:inherit}
#q:focus,button:focus-visible{outline:2px solid var(--ac)}
.hero{padding:44px 0 20px}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.2;max-width:640px}.hero p{color:var(--mu);margin-top:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.cats button{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--mu);padding:7px 16px;border-radius:99px;font:inherit;cursor:pointer}
.cats button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:50px}
.app{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.app .t{display:flex;gap:12px;align-items:center}.app img{width:60px;height:60px;border-radius:15px;object-fit:cover;background:var(--line)}
.app h3{font-size:17px}.app small{color:var(--mu)}.app p{color:var(--mu);font-size:14px;flex:1}
.dl{background:var(--am);color:#1b1200;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.ov.s{display:flex}
.bx{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:440px;text-align:center}
.bx iframe{width:100%;height:250px;border:1px dashed var(--line);border-radius:12px;background:#0003;margin:12px 0}
.bx .dl{width:100%}.bx .dl:disabled{opacity:.5}.bx a{color:var(--mu);font-size:13px;cursor:pointer}
.empty{color:var(--mu);padding:40px 0;grid-column:1/-1;text-align:center}
.app{cursor:pointer}.app p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{color:var(--am);letter-spacing:2px}.sr{font-size:13px;color:var(--mu);margin-top:2px}
.ctb{background:none;border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:12px;font:inherit;cursor:pointer}
.dt{text-align:left;max-width:540px;max-height:92vh;overflow:auto}.dt .t{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.dt img.big{width:84px;height:84px;border-radius:20px;object-fit:cover}.dt h2{font-size:22px}.dt h3{margin:18px 0 8px}
.sts{display:flex;justify-content:space-around;text-align:center;padding:12px 0;margin-bottom:14px;border-block:1px solid var(--line)}.sts b{display:block;font-size:17px}.sts small{color:var(--mu)}
.ds{color:var(--mu);margin-top:14px;line-height:1.6}.pk button{background:none;border:0;font-size:28px;color:var(--line);cursor:pointer}.pk button.on{color:var(--am)}
.dt input,.dt textarea,.bx input,.bx textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:10px;border-radius:10px;font:inherit;margin:4px 0 8px}
.rv{border-top:1px solid var(--line);padding:10px 0}.rv small{color:var(--mu)}
.fs{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}.fs.s{display:flex}
.fs .bar2{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0E1420;color:#fff;gap:10px}
.fs iframe{flex:1;border:0;width:100%;background:#fff}.fs .dl{padding:9px 16px}</style></head><body>
<header><div class='w bar'><div class='logo'>App<i>Hub</i></div><input id='q' placeholder='অ্যাপ খুঁজুন...' type='search'/><button class='ctb' id='cb'>যোগাযোগ</button><button class='ctb' id='ub'>লগইন</button></div></header>
<main class='w'><div id='ht'></div><div class='hero'><h1>সেরা অ্যাপ, এক জায়গায়</h1><p>খুঁজুন, ডাউনলোড করুন — সম্পূর্ণ ফ্রি।</p></div>
<div class='cats' id='cats'></div><div class='grid' id='grid'></div><div id='hb'></div></main>
<div class='fs' id='dm'><div class='bar2'><b id='st'></b><span><button class='dl' id='nx'></button> <a id='cl' style='color:#fff;cursor:pointer;margin-left:12px'>✕ বন্ধ</a></span></div><iframe id='ad'></iframe></div>
<div class='ov' id='dv'><div class='bx dt'><div id='dc'></div><br/><a id='dx' style='display:block;text-align:center'>বন্ধ করুন</a></div></div>
<div class='ov' id='ct'><div class='bx'><h3>আমাদের সাথে যোগাযোগ করুন</h3><br/><div id='ml' style='text-align:left;max-height:30vh;overflow:auto;margin-bottom:8px'></div><textarea id='cm' rows='4' placeholder='আপনার বার্তা'></textarea><button class='dl' id='cs'>পাঠান</button><br/><small id='cr' style='color:var(--mu)'></small><br/><a id='cx'>বন্ধ করুন</a></div></div>
<div class='ov' id='au'><div class='bx'><h3 id='at'>লগইন</h3><br/><input id='an' placeholder='আপনার নাম' style='display:none'/><input id='ae' type='email' placeholder='ইমেইল'/><input id='ap' type='password' placeholder='পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)'/><button class='dl' id='ab'>লগইন</button><br/><small id='ar' style='color:var(--am)'></small><br/><a id='as'>নতুন অ্যাকাউন্ট খুলুন</a> &nbsp;•&nbsp; <a id='ax'>বন্ধ করুন</a></div></div>
<div class='ov' id='pp'><div class='bx'><h3 id='pt'></h3><p id='pm' style='color:var(--mu);margin:10px 0 16px'></p><button class='dl' id='pb'>দেখুন</button><br/><br/><a id='pc'>বন্ধ করুন</a></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== এখানে আপনার Firebase কনফিগ বসান ======
var CFG={apiKey:"AIzaSyAWy2_xPZyEYzBZJb4NxIkb-IkuU8R4atM",authDomain:"appstore-55234.firebaseapp.com",projectId:"appstore-55234"};
// ===============================================
firebase.initializeApp(CFG);var db=firebase.firestore(),apps=[],cat='সব',ads={},$=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
db.collection('apps').orderBy('createdAt','desc').onSnapshot(function(s){apps=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});render()});
db.doc('config/ads').onSnapshot(function(d){ads=d.data()||{}});
db.doc('config/popup').onSnapshot(function(d){var p=d.data();if(!p||!p.enabled||localStorage.getItem('pp')==p.id)return;
$('pt').textContent=p.title;$('pm').textContent=p.message;$('pb').style.display=p.link?'':'none';
$('pb').onclick=function(){window.open(p.link,'_blank')};$('pp').classList.add('s');
$('pc').onclick=function(){localStorage.setItem('pp',p.id);$('pp').classList.remove('s')}});
$('q').oninput=render;
var revs=[],cur=null,pick=0;
function find(id){return apps.filter(function(a){return a.id==id})[0]}
function sx(id){var r=revs.filter(function(x){return x.appId==id}),t=0;r.forEach(function(x){t+=x.stars});return{n:r.length,avg:r.length?t/r.length:0,list:r}}
function stars(n){n=Math.round(n);return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
db.collection('reviews').orderBy('createdAt','desc').onSnapshot(function(s){revs=s.docs.map(function(d){return d.data()});render();if(cur)updR()});
function render(){var q=$('q').value.toLowerCase(),cs=['সব'];apps.forEach(function(a){if(a.category&&cs.indexOf(a.category)<0)cs.push(a.category)});
$('cats').innerHTML=cs.map(function(c){return '<button class="'+(c==cat?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
[].forEach.call($('cats').children,function(b){b.onclick=function(){cat=b.dataset.c;render()}});
var l=apps.filter(function(a){return(cat=='সব'||a.category==cat)&&((a.name+' '+(a.desc||'')+' '+(a.category||'')).toLowerCase().indexOf(q)>-1)});
$('grid').innerHTML=l.length?l.map(function(a){var r=sx(a.id);return '<div class="app" data-id="'+a.id+'"><div class="t"><img src="'+esc(a.icon)+'" alt=""/><div><h3>'+esc(a.name)+'</h3><small>'+esc(a.category)+' • '+esc(a.size)+'</small><div class="sr"><span class="st">'+stars(r.avg)+'</span> '+(r.n?r.avg.toFixed(1)+' ('+r.n+')':'নতুন')+'</div></div></div><p>'+esc(a.desc)+'</p><button class="dl" data-d="'+a.id+'">ডাউনলোড</button></div>'}).join(''):'<div class="empty">কোনো অ্যাপ পাওয়া যায়নি।</div>';
[].forEach.call(document.querySelectorAll('.app'),function(c){c.onclick=function(){openD(c.dataset.id)}});
[].forEach.call(document.querySelectorAll('.dl[data-d]'),function(b){b.onclick=function(e){e.stopPropagation();start(find(b.dataset.d))}})}
function drawPk(){$('pk').innerHTML=[1,2,3,4,5].map(function(i){return '<button data-s="'+i+'" class="'+(i<=pick?'on':'')+'">★</button>'}).join('');
[].forEach.call($('pk').children,function(b){b.onclick=function(){pick=+b.dataset.s;drawPk()}})}
function updR(){var a=find(cur);if(!a||!$('sx'))return;var r=sx(cur);
$('sx').innerHTML='<div><b>'+(r.n?r.avg.toFixed(1)+' ★':'—')+'</b><small>'+r.n+' রিভিউ</small></div><div><b>'+(a.downloads||0)+'</b><small>ডাউনলোড</small></div><div><b>'+esc(a.size)+'</b><small>সাইজ</small></div><div><b>v'+esc(a.version)+'</b><small>ভার্সন</small></div>';
$('rl').innerHTML=r.list.map(function(x){return '<div class="rv"><b>'+esc(x.name)+'</b> <span class="st">'+stars(x.stars)+'</span><br>'+esc(x.text)+'</div>'}).join('')||'<small>এখনো কোনো রিভিউ নেই। প্রথম রিভিউ আপনি দিন!</small>'}
function openD(id){var a=find(id);if(!a)return;cur=id;pick=0;
$('dc').innerHTML='<div class="t"><img class="big" src="'+esc(a.icon)+'" alt=""/><div><h2>'+esc(a.name)+'</h2><small style="color:var(--mu)">'+esc(a.category)+'</small></div></div><div class="sts" id="sx"></div><button class="dl" id="dd" style="width:100%">ডাউনলোড</button><p class="ds">'+esc(a.desc)+'</p><h3>রেটিং ও রিভিউ</h3><div class="pk" id="pk"></div><input id="rn" placeholder="আপনার নাম"/><textarea id="rt" rows="3" placeholder="আপনার মতামত লিখুন"></textarea><button class="dl" id="rs">রিভিউ দিন</button> <small id="rm"></small><div id="rl"></div>';
drawPk();updR();$('dv').classList.add('s');$('dd').onclick=function(){start(a)};
$('rs').onclick=function(){if(!user){authOpen();return}var t=$('rt').value.trim();if(!pick){$('rm').textContent='আগে তারকা বেছে নিন';return}
if(localStorage.getItem('r_'+id)){$('rm').textContent='আপনি আগেই রিভিউ দিয়েছেন';return}
db.collection('reviews').add({uid:user.uid,appId:id,name:user.displayName||$('rn').value.trim().slice(0,40)||'অজানা',stars:pick,text:t.slice(0,500),createdAt:Date.now()}).then(function(){localStorage.setItem('r_'+id,1);$('rm').textContent='ধন্যবাদ!';$('rt').value=''}).catch(function(){$('rm').textContent='পাঠানো যায়নি'})}}
$('dx').onclick=function(){cur=null;$('dv').classList.remove('s')};
$('cb').onclick=function(){$('ct').classList.add('s')};$('cx').onclick=function(){$('ct').classList.remove('s')};
$('cs').onclick=function(){if(!user){authOpen();return}var m=$('cm').value.trim();if(!m){$('cr').textContent='বার্তা লিখুন';return}
db.collection('messages').add({uid:user.uid,name:user.displayName||'',contact:user.email,text:m.slice(0,1000),createdAt:Date.now()}).then(function(){$('cr').textContent='পাঠানো হয়েছে, ধন্যবাদ!';$('cm').value=''}).catch(function(){$('cr').textContent='পাঠানো যায়নি'})};
function start(app){if(!user){authOpen();return}var step=1,t=parseInt(ads.timer)||10,iv;$('dm').classList.add('s');
$('cl').onclick=function(){clearInterval(iv);$('dm').classList.remove('s')};
function run(){var code=step==1?ads.ad1:ads.ad2;$('st').textContent='ধাপ '+step+'/2 — বিজ্ঞাপন';
setF($('ad'),ads.enabled===false?'':code,'<p style="font:16px sans-serif;color:#888;text-align:center;margin-top:40vh">বিজ্ঞাপনের জায়গা</p>');
var n=t;$('nx').disabled=true;clearInterval(iv);(function tick(){$('nx').textContent='অপেক্ষা করুন ('+n+')'})();
iv=setInterval(function(){n--;if(n>0){$('nx').textContent='অপেক্ষা করুন ('+n+')';return}clearInterval(iv);$('nx').disabled=false;
$('nx').textContent=step==1?'পরের ধাপ':'ডাউনলোড শুরু করুন';
$('nx').onclick=function(){if(step==1){step=2;run()}else{window.open(app.link,'_blank');db.collection('apps').doc(app.id).update({downloads:firebase.firestore.FieldValue.increment(1)});$('dm').classList.remove('s')}}},1000)}
run()}

var user=null,reg=false,mu=null;
function setF(el,c,ph){c=(c||'').trim();el.removeAttribute('src');el.removeAttribute('srcdoc');if(/^https?:\/\/\S+$/.test(c))el.src=c;else el.srcdoc=c||ph}
function authOpen(){$('au').classList.add('s')}
$('ax').onclick=function(){$('au').classList.remove('s')};
$('as').onclick=function(){reg=!reg;$('an').style.display=reg?'':'none';$('at').textContent=reg?'নতুন অ্যাকাউন্ট':'লগইন';$('ab').textContent=reg?'অ্যাকাউন্ট খুলুন':'লগইন';$('as').textContent=reg?'আগে থেকেই অ্যাকাউন্ট আছে?':'নতুন অ্যাকাউন্ট খুলুন'};
$('ab').onclick=function(){var e=$('ae').value.trim(),p=$('ap').value,A=firebase.auth(),n=$('an').value.trim();$('ar').textContent='';
if(reg&&!n){$('ar').textContent='নাম লিখুন';return}
(reg?A.createUserWithEmailAndPassword(e,p).then(function(c){return c.user.updateProfile({displayName:n}).then(function(){$('ub').textContent=n})}):A.signInWithEmailAndPassword(e,p)).then(function(){$('au').classList.remove('s')}).catch(function(x){$('ar').textContent=reg?'অ্যাকাউন্ট খোলা যায়নি (ইমেইল আগে ব্যবহৃত বা পাসওয়ার্ড ছোট)':'ইমেইল বা পাসওয়ার্ড ভুল'})};
$('ub').onclick=function(){if(user){if(confirm('লগআউট করবেন?'))firebase.auth().signOut()}else authOpen()};
firebase.auth().onAuthStateChanged(function(u){user=u;$('ub').textContent=u?(u.displayName||'অ্যাকাউন্ট'):'লগইন';if(mu){mu();mu=null}$('ml').innerHTML='';
if(u)mu=db.collection('messages').where('uid','==',u.uid).onSnapshot(function(s){$('ml').innerHTML=s.docs.map(function(d){return d.data()}).sort(function(a,b){return b.createdAt-a.createdAt}).map(function(m){return '<div class="rv"><b>আপনি:</b> '+esc(m.text)+'<br><span class="st">উত্তর:</span> '+(m.reply?esc(m.reply):'<small>অপেক্ষায়...</small>')+'</div>'}).join('')})});
function setStyle(id,css){var e=$(id);if(!e){e=document.createElement('style');e.id=id;document.head.appendChild(e)}e.textContent=css||''}
function cssLink(u){var e=$('cl2');if(!u){if(e)e.remove();return}if(!e){e=document.createElement('link');e.id='cl2';e.rel='stylesheet';document.head.appendChild(e)}e.href=u}
function fill(id,c){var e=$(id);c=(c||'').trim();e.innerHTML='';if(!c)return;if(/^https?:\/\/\S+$/.test(c)){var f=document.createElement('iframe');f.src=c;f.style.cssText='width:100%;height:240px;border:0;border-radius:14px';e.appendChild(f)}else e.innerHTML=c}
db.doc('config/site').onSnapshot(function(d){var c=d.data()||{},q=function(x){return document.querySelector(x)},r=document.documentElement.style;
if(c.siteName){document.title=c.siteName;q('.logo').textContent=c.siteName}
if(c.logo)q('.logo').innerHTML='<img src="'+esc(c.logo)+'" alt="" style="height:34px"/>';
if(c.heroTitle)q('.hero h1').textContent=c.heroTitle;if(c.heroSub)q('.hero p').textContent=c.heroSub;
if(c.accent)r.setProperty('--ac',c.accent);if(c.btn)r.setProperty('--am',c.btn);if(c.bg)r.setProperty('--bg',c.bg);
setStyle('sc',c.css);cssLink(c.cssUrl);fill('ht',c.htmlTop);fill('hb',c.htmlBottom);
if(c.js&&window.jsDone!=c.js){window.jsDone=c.js;try{new Function(c.js)()}catch(e){console.log(e)}}});
</script></body></html>
